<!-- ===========================================================================
     TABLERO DOCENTE — se abre en clase y la clase se construye con él.

     Sirve para las siete sesiones: se elige arriba. Lee las entregas del
     Apps Script y las muestra pregunta por pregunta, que es como se conduce
     la sesión: se proyecta lo que el grupo escribió y se contrasta.

     ⚠️ ESTA PÁGINA NECESITA EL TOKEN DE LECTURA (DASH_TOKEN), que NO está
     aquí ni puede estarlo: esto vive en un repositorio público. Se pone en
     `config.js`, que está en .gitignore, o se teclea al abrir y no se guarda.

     MODO PROYECCIÓN. Oculta nombres y correos y deja solo el seudónimo. Es lo
     que se enchufa al proyector. Enciéndalo ANTES de compartir pantalla.

     CONFRONTAR. La fila de letras (A B C…) bajo las preguntas filtra: pulsa una
     o varias y solo se ven esas, para poner dos o tres respuestas cara a cara.
     «Ver todas» las devuelve. Funciona también en proyección.

     RESUMEN IA. Cada tarjeta tiene «resumen IA»: llama a Ollama en local y pega
     un análisis de máquina en ocho campos —síntesis, qué sostiene, evidencia que
     nombra, cómo mide, vacío que reporta, tensión para discutir, pregunta para
     devolver al grupo y una cita verificada contra el texto— usando la pregunta
     de la sesión (TITULOS). Es borrador de lectura: NO se proyecta y se oculta en
     modo proyección. Las respuestas no salen del equipo. Requiere DOS cosas, y por eso solo sirve con el tablero
     abierto como ARCHIVO LOCAL, no por HTTPS:
       1. Ollama corriendo con el modelo (por defecto qwen2.5:7b).
       2. Lanzarlo permitiendo la llamada del navegador. En Windows PowerShell:
            $env:OLLAMA_ORIGINS = "*"; ollama serve
          (o el origen de esta página en vez de *). Sin esto, Ollama responde
          403 y la tarjeta muestra un aviso en rojo con esta misma instrucción.
     La URL y el modelo se pueden afinar en config.js (ollamaURL, ollamaModelo).
     =========================================================================== -->

<style>
:root{
  --marca:#22415C; --marca-dark:#163049; --marca-soft:#E3EAF0;
  --u1:#2360A6; --u1-dark:#164A87; --u1-soft:#DBE6F4;
  --ok:#0E8A80; --ok-soft:#D2EAE7; --alerta:#C0392B; --alerta-soft:#F7DDD9; --alerta-dark:#8E2A20;
  --tinta:#14202B; --gris:#4E6274; --gris-claro:#94A5B5;
  --linea:#D9E3EC; --blanco:#FFFFFF; --nieve:#F4F7FA;
  --shadow-soft:0 1px 2px rgba(20,32,43,.06), 0 6px 18px rgba(20,32,43,.06);
  --shadow-medium:0 6px 20px rgba(20,32,43,.10);

  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Segoe UI Mono',Consolas,monospace;

  --acento:var(--marca); --acento-dark:var(--marca-dark); --acento-soft:var(--marca-soft);
  --escala:1;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--tinta);background:var(--nieve);line-height:1.6}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.envoltura{max-width:74rem;margin:0 auto;padding:0 1.1rem}

/* ── Barra superior ─────────────────────────────────────────────── */
.barra{background:var(--tinta);color:var(--nieve);padding:.6rem 0;position:sticky;top:0;z-index:30;box-shadow:var(--shadow-medium)}
.barra .envoltura{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem}
.barra__t{font-weight:700;font-size:.92rem;margin-right:auto}
.barra__t small{display:block;font-weight:400;font-size:.74rem;color:var(--gris-claro)}
select,.barra button,.barra input{font:inherit;font-size:.82rem;border-radius:999px;padding:.32rem .85rem;
  border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--nieve);cursor:pointer}
select option{color:var(--tinta)}
.barra button:hover{background:rgba(255,255,255,.14)}
.barra button.on{background:var(--u1);color:var(--blanco);border-color:var(--u1);font-weight:700}
.cuentas{font-family:var(--mono);font-size:.8rem;color:var(--gris-claro);white-space:nowrap}

/* ── Aviso de conexión / token ──────────────────────────────────── */
.aviso{border-radius:var(--radius);padding:1rem 1.2rem;margin:1.2rem 0;background:var(--blanco);
  box-shadow:var(--shadow-soft);border-left:4px solid var(--gris-claro);max-width:60ch}
.aviso--malo{border-left-color:var(--alerta);background:var(--alerta-soft);color:var(--alerta-dark)}
.aviso--ok{border-left-color:var(--ok);background:var(--ok-soft)}
.aviso strong{display:block;margin-bottom:.25rem;color:var(--tinta)}
.aviso input{width:100%;font:inherit;padding:.5rem .7rem;border:1px solid #B9CADA;border-radius:var(--radius-sm);
  margin-top:.6rem;background:var(--blanco);color:var(--tinta)}
.aviso button{font:inherit;font-weight:600;margin-top:.6rem;cursor:pointer;border-radius:999px;
  padding:.45rem 1.2rem;border:1px solid var(--acento-dark);background:var(--acento-dark);color:var(--blanco)}

/* ── Navegador de preguntas ─────────────────────────────────────── */
.preguntas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.3rem 0 .4rem}
.preguntas button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:.45rem 1.1rem;
  border:1px solid var(--acento);background:var(--blanco);color:var(--acento-dark);font-size:.9rem}
.preguntas button:hover{background:var(--acento-soft)}
.preguntas button.activa{background:var(--acento-dark);color:var(--blanco);border-color:var(--acento-dark)}
.preguntas button .n{font-family:var(--mono);font-size:.72rem;opacity:.75;margin-left:.35rem}

.titulo-pregunta{font-family:var(--serif);font-size:calc(1.3rem * var(--escala));margin:.8rem 0 .2rem;line-height:1.25}
.sub{color:var(--gris);font-size:.88rem;margin:0 0 1rem}

/* ── Respuestas ─────────────────────────────────────────────────── */
.respuestas{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,26rem),1fr));padding-bottom:3rem}
.tarjeta{background:var(--blanco);border-radius:var(--radius);padding:1rem 1.15rem;
  box-shadow:var(--shadow-soft);border-left:4px solid var(--acento);display:flex;flex-direction:column}
.tarjeta.leida{border-left-color:var(--gris-claro);opacity:.62}
.tarjeta__cab{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;flex-wrap:wrap}
.seudo{font-family:var(--mono);font-weight:700;font-size:1rem;background:var(--acento-soft);
  color:var(--acento-dark);border-radius:var(--radius-sm);padding:.1rem .6rem;flex-shrink:0}
.quien{font-size:.82rem;color:var(--gris);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca{font:inherit;font-size:.74rem;cursor:pointer;border-radius:999px;padding:.15rem .65rem;
  border:1px solid var(--gris-claro);background:transparent;color:var(--gris);flex-shrink:0}
.marca:hover{background:var(--nieve)}
.tarjeta__txt{font-size:calc(.95rem * var(--escala));white-space:pre-wrap;word-wrap:break-word;margin:0;font-family:var(--serif);line-height:1.55}
.tarjeta__pie{font-family:var(--mono);font-size:.72rem;color:var(--gris-claro);margin:.7rem 0 0}
.vacia{color:var(--gris-claro);font-style:italic;font-family:var(--sans)}

/* ── Panel: quién falta (solo modo docente) ─────────────────────── */
.faltantes{background:var(--blanco);border-radius:var(--radius);padding:1rem 1.2rem;
  box-shadow:var(--shadow-soft);border-left:4px solid var(--marca);margin:1.2rem 0;max-width:60ch}
.faltantes h2{font-size:1rem;margin:0 0 .5rem;color:var(--marca-dark)}
.faltantes ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:var(--gris);columns:2;column-gap:1.5rem}
.faltantes li{margin-bottom:.2rem;break-inside:avoid}

/* En proyección desaparece todo lo que identifica. */
body.proyeccion .quien,
body.proyeccion .faltantes,
body.proyeccion .tarjeta__pie,
body.proyeccion .marca{display:none}
body.proyeccion{background:var(--nieve)}
body.proyeccion .tarjeta{box-shadow:var(--shadow-medium)}

/* ── Selector de participantes (confrontar respuestas) ──────────── */
.participantes{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.2rem 0 .7rem}
.participantes .et{font-size:.8rem;color:var(--gris);margin-right:.15rem}
.participantes button{font:inherit;font-weight:700;font-family:var(--mono);cursor:pointer;border-radius:999px;
  padding:.28rem .72rem;border:1px solid var(--acento);background:var(--blanco);color:var(--acento-dark);font-size:.84rem}
.participantes button:hover{background:var(--acento-soft)}
.participantes button.sel{background:var(--acento-dark);color:var(--blanco);border-color:var(--acento-dark)}
.participantes button.limpiar{font-family:var(--sans);font-weight:600;border-color:var(--gris-claro);color:var(--gris)}
.participantes button.ia{font-family:var(--sans);font-weight:600;border-color:var(--ok);color:var(--ok);margin-left:auto}
.participantes button.ia:hover{background:var(--ok-soft)}

/* ── Resumen IA por respuesta — ayuda docente, nunca a proyección ── */
.tarjeta__ia{font:inherit;font-size:.74rem;cursor:pointer;border-radius:999px;padding:.15rem .65rem;
  border:1px solid var(--ok);background:transparent;color:var(--ok);flex-shrink:0}
.tarjeta__ia:hover{background:var(--ok-soft)}
.resumen-ia{margin:.7rem 0 0;padding:.55rem .75rem;border-radius:var(--radius-sm);background:var(--ok-soft);
  border-left:3px solid var(--ok);font-size:calc(.86rem * var(--escala));line-height:1.5;font-family:var(--sans)}
.resumen-ia .et{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ok);display:block;margin-bottom:.2rem}
.resumen-ia .datos{color:var(--gris);font-size:.82rem;margin-top:.35rem}
.resumen-ia .campo-ia{margin:.35rem 0 0}
.resumen-ia .campo-ia b{display:block;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ok)}
.resumen-ia .vacio-ia{color:var(--gris-claro)}
.resumen-ia .cita-ia{font-family:var(--serif);font-style:italic;border-top:1px dashed rgba(14,138,128,.35);padding-top:.35rem}
.resumen-ia.malo{background:var(--alerta-soft);border-left-color:var(--alerta);color:var(--alerta-dark)}
.resumen-ia.malo .et{color:var(--alerta-dark)}

/* En proyección desaparece el resumen de máquina y sus botones. */
body.proyeccion .tarjeta__ia,
body.proyeccion .resumen-ia,
body.proyeccion .participantes .ia{display:none}

/* ── Síntesis agregada por pregunta — ESTA SÍ se proyecta ────────
   Junta todas las respuestas y no distingue a nadie: ni seudónimos ni
   letras. Por eso es la vista pensada para el proyector. */
.sintesis{display:none}
body.vista-sintesis .sintesis{display:block}
body.vista-sintesis .respuestas,
body.vista-sintesis .participantes,
body.vista-sintesis .faltantes{display:none}
.sintesis__acciones{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.2rem 0 1rem}
.sintesis__acciones button{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:999px;
  padding:.3rem .8rem;border:1px solid var(--ok);background:var(--blanco);color:var(--ok)}
.sintesis__acciones button:hover{background:var(--ok-soft)}
.sintesis__acciones button.otra{border-color:var(--gris-claro);color:var(--gris)}
.senales{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.1rem}
.senal{background:var(--blanco);border:1px solid var(--gris-claro);border-radius:999px;
  padding:.2rem .75rem;font-size:calc(.84rem * var(--escala));color:var(--gris)}
.senal b{font-family:var(--mono);color:var(--acento-dark)}
.senal.falta{border-color:var(--aviso);color:var(--aviso-dark);background:var(--aviso-soft)}
.senal.falta b{color:var(--aviso-dark)}
.ideas{list-style:none;padding:0;margin:0;display:grid;gap:.55rem}
.idea{background:var(--blanco);border-radius:var(--radius);box-shadow:var(--shadow-soft);
  border-left:4px solid var(--acento);padding:.7rem 1rem;font-size:calc(1.02rem * var(--escala));line-height:1.45}
.idea .peso{font-family:var(--mono);font-size:.78em;color:var(--acento-dark);background:var(--acento-soft);
  border-radius:999px;padding:.05rem .55rem;margin-left:.45rem;white-space:nowrap}
.bloque{margin-top:1.1rem}
.bloque h3{font-size:.72rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;
  color:var(--gris);margin:0 0 .25rem}
.bloque p{margin:.15rem 0;font-size:calc(.98rem * var(--escala));line-height:1.5}
.bloque ul{margin:.15rem 0;padding-left:1.1rem;font-size:calc(.98rem * var(--escala));line-height:1.5}
.citas{list-style:none;padding:0;margin:.15rem 0;display:grid;gap:.4rem}
.citas li{font-family:var(--serif);font-style:italic;border-left:3px solid var(--acento-soft);
  padding-left:.75rem;font-size:calc(1rem * var(--escala));line-height:1.45}
.sintesis__meta{font-family:var(--mono);font-size:.74rem;color:var(--gris-claro);margin:1rem 0 0}
.sintesis__espera{color:var(--gris);font-size:.95rem}
/* En proyección desaparecen los mandos y las marcas de máquina. */
body.proyeccion .sintesis__acciones,
body.proyeccion .sintesis__meta,
body.proyeccion .no-proyectar{display:none}

.pie{color:var(--gris-claro);font-size:.8rem;padding:1.5rem 0 2.5rem;max-width:60ch}
@media print{.barra,.preguntas,.participantes,.marca,.tarjeta__ia,.resumen-ia{display:none}}
</style>

<!-- config.js NO está en el repositorio (.gitignore): lleva el token de
     lectura. Si falta, el tablero lo pide por teclado y no lo guarda. -->
<script src="../config.js" onerror="void 0"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var CFG = (window.CONFIG || {});
  var ENDPOINT = CFG.appsScriptURL || '';
  var DASH = CFG.dashToken || '';

  // Ollama local, para el resumen IA. Solo funciona con el tablero abierto
  // como ARCHIVO LOCAL y con Ollama lanzado con OLLAMA_ORIGINS abierto (ver
  // la cabecera de este archivo). Se puede afinar desde config.js.
  var OLLAMA = (CFG.ollamaURL || 'http://localhost:11434').replace(/\/+$/, '');
  var MODELO_IA = CFG.ollamaModelo || 'qwen2.5:7b';

  // Títulos legibles de cada pregunta. El servidor devuelve solo los ids
  // (p1, p2…), porque no sabe —ni tiene por qué— cómo se llaman.
  var TITULOS = {
    S01: {
      p1: '¿Qué rehabilitación se ofrece hoy en tu servicio, en esta trayectoria?',
      p2: '¿Con qué criterio se decide a quién se rehabilita, y a quién deja fuera?',
      p3: '¿Con qué desenlace se mide el éxito? ¿Se registra? Función frente a supervivencia',
      p4: 'Un desenlace de la lectura: qué captura y qué deja invisible',
      p5: 'Convierte una afirmación del material en una pregunta investigable'
    },
    S02: {
      p1: 'Dolor: lo que usamos, ¿funciona en la población paliativa? (ejercicio, TENS, masaje; cómo se mide)',
      p2: '¿Cómo se maneja el linfedema o el edema en tu servicio? ¿Quién, con qué criterio y cómo se mide?',
      p3: 'Neuromuscular: prevenir, no solo tratar, y saber cuándo es seguro mover (SINS, Mirels)',
      p4: 'Un desenlace psicosocial y cómo lo medirías en cáncer avanzado (GAS, instrumento validado)',
      p5: 'Un vacío de la evidencia, vuelto pregunta investigable con población, desenlace e instrumento'
    }
  };

  // Resumen analítico local. Más largo que el del guion de preparación
  // (scripts/resumir-entregas.js): aquí se lee en vivo, respuesta por respuesta.
  // Todo corre en Ollama, en este equipo: las respuestas no salen de aquí.
  var CAMPOS_IA = [
    ['sintesis',  'SINTESIS',  'Síntesis'],
    ['argumento', 'ARGUMENTO', 'Qué sostiene'],
    ['evidencia', 'EVIDENCIA', 'Evidencia que nombra'],
    ['medicion',  'MEDICION',  'Cómo mide'],
    ['vacio',     'VACIO',     'Vacío que reporta'],
    ['tension',   'TENSION',   'Tensión para discutir'],
    ['pregunta',  'PREGUNTA',  'Para devolver al grupo'],
    ['cita',      'CITA',      'Cita']
  ];
  function PROMPT(texto, pregunta) {
    return 'Eres asistente de un docente de una maestría en cuidados paliativos que enseña investigación en rehabilitación. ' +
      'Vas a analizar la respuesta escrita por un estudiante (profesional de la salud) a una pregunta de preparación de clase. ' +
      'Responde en español, sin markdown, y devuelve EXACTAMENTE estos ocho bloques, cada uno en una línea que empiece por su etiqueta:\n\n' +
      'SINTESIS: dos o tres frases que digan qué responde y cuál es su posición.\n' +
      'ARGUMENTO: la idea central que sostiene y en qué se apoya (su experiencia, un dato, una fuente).\n' +
      'EVIDENCIA: fuentes, estudios, guías, cifras o instrumentos que el texto nombra. Si no nombra ninguno, escribe: no cita evidencia.\n' +
      'MEDICION: cómo describe o propone medir el desenlace (instrumento, escala, registro). Si no lo menciona, escribe: no lo menciona.\n' +
      'VACIO: lo que según el texto no existe, no se registra o no se hace en su servicio. Si no lo menciona, escribe: no lo menciona.\n' +
      'TENSION: un punto discutible, una generalización o una contradicción útil para la discusión en clase.\n' +
      'PREGUNTA: una pregunta breve que el docente pueda devolver al grupo a partir de esta respuesta.\n' +
      'CITA: la frase más reveladora, COPIADA LITERALMENTE del texto, sin cambiar ni una palabra ni una tilde.\n\n' +
      'Reglas: en SINTESIS, ARGUMENTO, EVIDENCIA, MEDICION, VACIO y CITA usa solo lo que está en el texto; no inventes fuentes ni cifras. ' +
      'En TENSION y PREGUNTA puedes razonar, sin atribuir al estudiante algo que no dijo.\n\n' +
      'PREGUNTA DE LA SESIÓN: ' + (pregunta || '(no disponible)') + '\n\n' +
      'RESPUESTA DEL ESTUDIANTE:\n"""\n' + texto + '\n"""';
  }
  function parsearIA(salida) {
    var etiquetas = 'SINTESIS|SÍNTESIS|ARGUMENTO|EVIDENCIA|MEDICION|MEDICIÓN|VACIO|VACÍO|TENSION|TENSIÓN|PREGUNTA|CITA';
    var re = new RegExp('^[\\s*#-]*(' + etiquetas + ')\\s*\\**\\s*:\\s*', 'gim');
    var marcas = [], m;
    while ((m = re.exec(salida)) !== null) marcas.push({ etq: m[1], ini: m.index, fin: re.lastIndex });
    var norm = function (x) { return x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase(); };
    var res = {};
    marcas.forEach(function (mk, k) {
      var hasta = k + 1 < marcas.length ? marcas[k + 1].ini : salida.length;
      var campo = CAMPOS_IA.filter(function (c) { return c[1] === norm(mk.etq); })[0];
      if (campo && !res[campo[0]]) res[campo[0]] = salida.slice(mk.fin, hasta).trim();
    });
    return res;
  }
  // Una cita solo se muestra si aparece en el texto original, y con su grafía real.
  function verificarCita(cita, original) {
    var sinTildes = function (x) { return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };
    var limpia = String(cita || '').replace(/^[\u00ab"'\u201c\s]+|[\u00bb"'\u201d\s.]+$/g, '').trim();
    if (limpia.length < 20) return null;
    if (original.indexOf(limpia) !== -1) return limpia;
    var mapa = [], normal = '';
    for (var i = 0; i < original.length; i++) {
      var c = sinTildes(original[i]).toLowerCase();
      if (/\s/.test(c)) { if (normal.slice(-1) === ' ') continue; normal += ' '; mapa.push(i); }
      else { normal += c; mapa.push(i); }
    }
    var objetivo = sinTildes(limpia).toLowerCase().replace(/\s+/g, ' ').trim();
    var pos = normal.indexOf(objetivo);
    if (pos === -1) return null;
    return original.slice(mapa[pos], mapa[Math.min(pos + objetivo.length - 1, mapa.length - 1)] + 1).trim();
  }

  /* ── Síntesis agregada: señales contadas (sin IA) ────────────────
     Se calculan con expresiones regulares sobre los textos: son exactas,
     auditables y funcionan aunque Ollama no esté corriendo. */
  var INSTRUMENTOS = [
    ['ESAS', /\besas\b/i], ['IPOS', /\bipos\b/i], ['EORTC QLQ-C30', /eortc|qlq-?\s?c-?30/i],
    ['Escala numérica 0–10', /escala num[ée]rica|\bnrs\b|\bevn\b/i],
    ['EVA', /\beva\b|visual an[áa]loga/i], ['Brief Pain Inventory', /\bbpi\b|brief pain/i],
    ['mMRC', /\bmmrc\b|medical research council/i], ['Borg', /\bborg\b/i],
    ['Barthel', /barthel/i], ['Karnofsky', /karnofsky|\bkps\b/i],
    ['PPS', /\bpps\b|palliative performance/i], ['ECOG', /\becog\b/i],
    ['Caminata de 6 minutos', /6\s*min|seis minutos|6mwt|caminata de 6/i], ['SPPB', /\bsppb\b/i],
    ['Timed up and go', /timed up|\btug\b/i],
    ['Dinamometría', /dinamom|fuerza de prensi[óo]n|handgrip/i], ['Goniometría', /goniom/i],
    ['EAT-10', /eat-?\s?10/i], ['MECV-V', /mecv-?v|volumen[- ]viscosidad/i], ['IDDSI', /iddsi/i],
    ['SINS', /\bsins\b/i], ['Mirels', /mirels/i],
    ['Perimetría o volumen', /per[íi]metro|perimetr|volumetr/i], ['Bioimpedancia', /bioimpedanc/i],
    ['Zarit', /zarit/i], ['HADS · PHQ-9 · GAD-7', /\bhads\b|phq-?\s?9|gad-?\s?7/i], ['MNA', /\bmna\b/i],
    ['Goal Attainment Scaling', /goal attainment|\bgas\b/i], ['FIM', /\bfim\b/i],
    ['Tinetti o Berg', /tinetti|escala de berg/i], ['NYHA', /\bnyha\b/i],
    ['Fatiga (FSS · BFI)', /\bfss\b|\bbfi\b|brief fatigue/i]
  ];
  var AUSENCIAS = [
    ['no se mide', /no se mide|no se registra|no se documenta|no se cuantifica|\ba ojo\b|sin instrumento|no se eval[úu]a/i],
    ['no hay ruta ni protocolo', /no (hay|existe|tenemos|contamos con)[^.;]{0,45}(ruta|protocolo|gu[íi]a|programa|servicio)|sin protocolo|no est[áa] protocolizad/i],
    ['no se remite', /no se remite|no hay remisi|no se deriva|no se solicita interconsulta|no llega la interconsulta/i],
    ['faltan personal, tiempo o recursos', /no hay (fisioterapeuta|terapeuta|personal|tiempo|recursos)|falta de personal|falta personal|no alcanza el tiempo|no hay talento humano/i]
  ];
  // Si el modelo no logra copiar una cita literal, se extraen frases reales
  // de los propios textos: son literales por construcción.
  function citasDetectadas(textos) {
    var patrones = AUSENCIAS.map(function (p) { return p[1]; })
      .concat([/siempre se ha usado/i, /no s[ée] si sirve/i, /\ba ojo\b/i, /nadie/i]);
    var fuera = [];
    textos.forEach(function (t) {
      t.split(/(?<=[.;!?])\s+|\n+/).forEach(function (fr) {
        var limpia = fr.trim().replace(/^[-–\s]+/, '').replace(/[.;\s]+$/, '');
        var n = limpia ? limpia.split(/\s+/).length : 0;
        if (n < 4 || n > 18) return;
        if (!patrones.some(function (re) { return re.test(limpia); })) return;
        if (fuera.indexOf(limpia) === -1) fuera.push(limpia);
      });
    });
    return fuera.sort(function (a, b) { return a.length - b.length; }).slice(0, 3);
  }

  function senales(textos) {
    var n = textos.length, res = { n: n, instrumentos: [], ausencias: [], palabras: 0 };
    if (!n) return res;
    INSTRUMENTOS.forEach(function (par) {
      var c = textos.filter(function (t) { return par[1].test(t); }).length;
      if (c) res.instrumentos.push({ etq: par[0], n: c });
    });
    AUSENCIAS.forEach(function (par) {
      var c = textos.filter(function (t) { return par[1].test(t); }).length;
      if (c) res.ausencias.push({ etq: par[0], n: c });
    });
    res.instrumentos.sort(function (a, b) { return b.n - a.n; });
    res.ausencias.sort(function (a, b) { return b.n - a.n; });
    res.palabras = Math.round(textos.reduce(function (a, t) {
      return a + (t.trim() ? t.trim().split(/\s+/).length : 0);
    }, 0) / n);
    return res;
  }

  /* ── Síntesis agregada: el prompt ────────────────────────────────
     Recibe TODAS las respuestas de una pregunta, numeradas 1..n solo para
     poder contar apoyos; los números nunca se muestran en proyección. */
  function PROMPT_SINTESIS(textos, pregunta) {
    var cuerpo = textos.map(function (t, i) {
      return 'RESPUESTA ' + (i + 1) + ':\n"""\n' + t + '\n"""';
    }).join('\n\n');
    return 'Eres asistente de un docente de una maestría en cuidados paliativos que enseña investigación en rehabilitación. ' +
      'Lees TODAS las respuestas del grupo a una misma pregunta y escribes una síntesis que se PROYECTARÁ en clase.\n\n' +
      'Anonimato (obligatorio): no nombres personas, instituciones, hospitales, ciudades ni cargos, aunque aparezcan. ' +
      'Escribe en plural e impersonal. No escribas números de respuesta dentro de las frases.\n' +
      'Fidelidad: usa solo lo que está escrito. No inventes datos, fuentes ni instrumentos.\n' +
      'Forma: rellena cada línea con el CONTENIDO REAL. No copies estas instrucciones, no uses paréntesis ' +
      'explicativos, no añadas líneas extra, no uses markdown. Cada bloque va en una sola línea.\n\n' +
      'Líneas que debes devolver, en este orden:\n' +
      'cinco líneas IDEA (de la más respaldada a la menos), luego ACUERDO, TENSION, INSTRUMENTOS, VACIO, ' +
      'PREGUNTAS y hasta tres líneas CITA.\n\n' +
      'Este es un ejemplo de salida BIEN HECHA, sobre otro tema (disfagia), solo para que copies la forma:\n' +
      'IDEA: El tamizaje se hace de oído, sin ninguna prueba estandarizada || APOYOS: 1,3,4\n' +
      'IDEA: Se espesan los líquidos antes de intentar cualquier compensación postural || APOYOS: 2,4\n' +
      'IDEA: La familia queda sola con la decisión de seguir alimentando por boca || APOYOS: 1,2\n' +
      'IDEA: La valoración por fonoaudiología depende de que haya profesional disponible || APOYOS: 3\n' +
      'IDEA: Nadie repite la valoración cuando la persona empeora || APOYOS: 2,3\n' +
      'ACUERDO: Todas describen decisiones tomadas sin prueba instrumental.\n' +
      'TENSION: Unas priorizan evitar la aspiración; otras, que la persona siga comiendo lo que quiere.\n' +
      'INSTRUMENTOS: prueba de sorbo de agua, EAT-10\n' +
      'VACIO: Ninguna menciona la higiene oral ni la evaluación instrumental.\n' +
      'PREGUNTAS: ¿Quién decide cuándo se espesa? / ¿Qué haría falta para repetir la valoración?\n' +
      'CITA: se decide de oído || DE: 1\n\n' +
      'Las líneas CITA se COPIAN Y PEGAN: elige un fragmento de entre cuatro y doce palabras que esté ' +
      'literalmente en una respuesta, sin cambiar ni una palabra ni una tilde, y sin nombres propios. ' +
      'Si no puedes copiar ninguno exacto, no escribas ninguna línea CITA.\n\n' +
      'Ahora hazlo de verdad con las respuestas de abajo. No hables de disfagia si no aparece en ellas.\n\n' +
      'PREGUNTA DE LA SESIÓN: ' + (pregunta || '(no disponible)') + '\n\n' + cuerpo;
  }

  // El modelo a veces devuelve la instrucción en vez del contenido, y pone lo
  // bueno debajo entre paréntesis. Se detecta y se recupera.
  function esPlantilla(t) {
    return /^<|^(la idea|una frase|en qu[ée] coinciden|el desacuerdo|algo esperable|dos preguntas|escalas, instrumentos|n[úu]meros de|una frase copiada)/i.test(String(t || '').trim());
  }
  function parsearSintesis(salida, textos) {
    var res = { ideas: [], citas: [] };
    var simples = { ACUERDO: 'acuerdo', TENSION: 'tension', 'TENSIÓN': 'tension',
                    INSTRUMENTOS: 'instrumentos', VACIO: 'vacio', 'VACÍO': 'vacio', PREGUNTAS: 'preguntas' };
    var lineas = String(salida || '').split(/\r?\n/).map(function (x) { return x.replace(/^[\s*#\-–]+/, '').trim(); });
    lineas.forEach(function (l, idx) {
      if (!l) return;
      var m = l.match(/^(IDEA|ACUERDO|TENSION|TENSIÓN|INSTRUMENTOS|VACIO|VACÍO|PREGUNTAS|CITA)\s*\**\s*:\s*(.*)$/i);
      if (!m) return;
      var etq = m[1].toUpperCase(), cuerpo = m[2].trim();
      if (esPlantilla(cuerpo.split(/\s*\|\|\s*/)[0])) {
        var sig = lineas[idx + 1] || '';
        var rescate = sig.match(/^\((.+)\)\.?$/);
        if (!rescate || /^(IDEA|ACUERDO|TENSION|INSTRUMENTOS|VACIO|PREGUNTAS|CITA)\s*:/i.test(sig)) return;
        var apoyos0 = cuerpo.split(/\s*\|\|\s*/)[1] || '';
        cuerpo = rescate[1].trim() + (apoyos0 ? ' || ' + apoyos0 : '');
      }
      var partes = cuerpo.split(/\s*\|\|\s*/);
      if (etq === 'IDEA') {
        var apoyos = [];
        (partes[1] || '').replace(/APOYOS\s*:?/i, '').split(/[,;\s]+/).forEach(function (x) {
          var k = parseInt(x, 10);
          if (k >= 1 && k <= textos.length && apoyos.indexOf(k) === -1) apoyos.push(k);
        });
        var txt = partes[0].replace(/\s*\(?respuestas?[^)]*\)?\s*$/i, '').trim();
        if (txt) res.ideas.push({ texto: txt, apoyos: apoyos.length });
      } else if (etq === 'CITA') {
        var de = parseInt((partes[1] || '').replace(/DE\s*:?/i, ''), 10);
        var propuesta = partes[0];
        var origen = (de >= 1 && de <= textos.length) ? [textos[de - 1]] : textos;
        var verificada = null;
        origen.forEach(function (t) { if (!verificada) verificada = verificarCita(propuesta, t); });
        if (!verificada) textos.forEach(function (t) { if (!verificada) verificada = verificarCita(propuesta, t); });
        if (verificada) res.citas.push(verificada);
      } else if (simples[etq]) {
        if (!res[simples[etq]]) res[simples[etq]] = partes[0];
      }
    });
    return res;
  }

  var datos = null, preguntaActiva = null;
  var seleccion = {}, cacheIA = {}, cacheSint = {};
  var sesion = (new URLSearchParams(location.search).get('sesion') || 'S01').toUpperCase();
  $('sesion').value = sesion;

  /* ── Marcas de «ya discutida» — solo en este navegador ──────────── */
  function claveMarca() { return 'INV_REHAB_tablero_leidas_' + sesion; }
  function leidas() {
    try { return JSON.parse(localStorage.getItem(claveMarca()) || '{}'); }
    catch (err) { return {}; }
  }
  function alternarMarca(id) {
    var m = leidas();
    m[id] ? delete m[id] : m[id] = 1;
    try { localStorage.setItem(claveMarca(), JSON.stringify(m)); } catch (err) { /* sin persistencia */ }
    pintarRespuestas();
  }

  /* ── Aviso ──────────────────────────────────────────────────────── */
  function aviso(clase, titulo, texto, conCampo) {
    var el = $('aviso');
    el.style.display = 'block';
    el.className = 'aviso ' + (clase || '');
    el.textContent = '';
    var s = document.createElement('strong'); s.textContent = titulo; el.appendChild(s);
    el.appendChild(document.createTextNode(texto));
    if (!conCampo) return;

    var campoUrl = document.createElement('input');
    campoUrl.placeholder = 'URL /exec del Apps Script';
    campoUrl.value = ENDPOINT;
    var campoTok = document.createElement('input');
    campoTok.placeholder = 'DASH_TOKEN';
    campoTok.value = DASH;
    campoTok.type = 'password';
    var boton = document.createElement('button');
    boton.textContent = 'Conectar';
    boton.onclick = function () {
      ENDPOINT = campoUrl.value.trim();
      DASH = campoTok.value.trim();
      if (ENDPOINT && DASH) cargar();
    };
    el.appendChild(campoUrl);
    el.appendChild(campoTok);
    el.appendChild(boton);
  }

  /* ── Carga ──────────────────────────────────────────────────────── */
  function cargar() {
    if (!ENDPOINT || !DASH) {
      aviso('', 'Falta la conexión.',
        ' No se encontró config.js con la URL y el token de lectura. Escríbelos aquí — no se guardan.',
        true);
      return;
    }
    $('aviso').style.display = 'none';
    $('cuentas').textContent = 'cargando…';
    cacheIA = {};  // las entregas se releen; los resúmenes viejos podrían estar caducos

    var url = ENDPOINT + '?action=tablero&dash=' + encodeURIComponent(DASH) +
              '&sesion=' + encodeURIComponent(sesion) + '&t=' + Date.now();
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) {
          datos = null;
          $('cuentas').textContent = '—';
          aviso('aviso--malo', 'El servidor rechazó la consulta.',
            d.error === 'no_autorizado'
              ? ' El DASH_TOKEN no es correcto. Está en Apps Script → Configuración del proyecto → Propiedades del script.'
              : ' ' + (d.error || 'error desconocido') + '.',
            d.error === 'no_autorizado');
          pintarPreguntas(); pintarRespuestas(); pintarSintesis();
          return;
        }
        datos = d;
        if (d.preguntas.length && (!preguntaActiva || d.preguntas.indexOf(preguntaActiva) === -1)) {
          preguntaActiva = d.preguntas[0];
        }
        $('cuentas').textContent = d.entregas + '/' + d.inscritos + ' entregas';
        pintarFaltantes(); pintarPreguntas(); pintarParticipantes(); pintarRespuestas();
      })
      .catch(function () {
        $('cuentas').textContent = '—';
        aviso('aviso--malo', 'No se pudo conectar.', ' Revisa la conexión y la URL del despliegue.', true);
      });
  }

  /* ── Pintado ────────────────────────────────────────────────────── */
  function pintarFaltantes() {
    var el = $('faltantes');
    if (!datos || !datos.faltantes || !datos.faltantes.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.textContent = '';
    var h = document.createElement('h2');
    h.textContent = 'Sin entregar · ' + datos.faltantes.length;
    el.appendChild(h);
    var ul = document.createElement('ul');
    datos.faltantes.forEach(function (p) {
      var li = document.createElement('li');
      li.textContent = p.nombre || p.correo;
      ul.appendChild(li);
    });
    el.appendChild(ul);
  }

  function pintarPreguntas() {
    var cont = $('preguntas');
    cont.textContent = '';
    if (!datos || !datos.preguntas.length) return;

    datos.preguntas.forEach(function (id) {
      var conCuantas = datos.respuestas.filter(function (r) {
        return String(r.respuestas[id] || '').trim();
      }).length;
      var b = document.createElement('button');
      b.textContent = id.toUpperCase();
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = conCuantas;
      b.appendChild(n);
      if (id === preguntaActiva) b.className = 'activa';
      b.onclick = function () { preguntaActiva = id; pintarPreguntas(); pintarRespuestas(); pintarSintesis(); };
      cont.appendChild(b);
    });
  }

  /* ── Selector de participantes: elegir 1-3 para confrontarlas ───── */
  function pintarParticipantes() {
    var cont = $('participantes');
    cont.textContent = '';
    if (!datos || !datos.respuestas || !datos.respuestas.length) return;

    var et = document.createElement('span');
    et.className = 'et';
    et.textContent = 'Confrontar:';
    cont.appendChild(et);

    datos.respuestas.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = r.seudonimo;
      if (seleccion[r.seudonimo]) b.className = 'sel';
      b.onclick = function () {
        if (seleccion[r.seudonimo]) delete seleccion[r.seudonimo]; else seleccion[r.seudonimo] = 1;
        pintarParticipantes(); pintarRespuestas();
      };
      cont.appendChild(b);
    });

    var elegidas = Object.keys(seleccion).length;
    if (elegidas) {
      var limpiar = document.createElement('button');
      limpiar.type = 'button';
      limpiar.className = 'limpiar';
      limpiar.textContent = 'Ver todas';
      limpiar.onclick = function () { seleccion = {}; pintarParticipantes(); pintarRespuestas(); };
      cont.appendChild(limpiar);
    }

    var ia = document.createElement('button');
    ia.type = 'button';
    ia.className = 'ia';
    ia.textContent = 'Resumen IA de las visibles';
    ia.onclick = resumirVisibles;
    cont.appendChild(ia);
  }

  /* ── Resumen con Ollama (borrador de máquina, ayuda de lectura) ─── */
  function nodoResumen(res) {
    var div = document.createElement('div');
    div.className = 'resumen-ia' + (res.estado === 'error' ? ' malo' : '');
    var et = document.createElement('span');
    et.className = 'et';
    if (res.estado === 'cargando') {
      et.textContent = 'Resumen IA';
      div.appendChild(et);
      div.appendChild(document.createTextNode('Analizando con ' + MODELO_IA + ' en este equipo… (10 a 30 s por respuesta)'));
      return div;
    }
    if (res.estado === 'error') {
      et.textContent = 'Resumen IA — sin conexión';
      div.appendChild(et);
      div.appendChild(document.createTextNode(res.msg));
      return div;
    }
    et.textContent = 'Resumen IA · ' + MODELO_IA + ' · borrador de máquina, revísalo';
    div.appendChild(et);
    var hayAlgo = false;
    CAMPOS_IA.forEach(function (c) {
      var valor = res[c[0]];
      if (c[0] === 'cita' || !valor) return;
      hayAlgo = true;
      var fila = document.createElement('div');
      fila.className = 'campo-ia' + (/^(no cita evidencia|no lo menciona)\.?$/i.test(valor) ? ' vacio-ia' : '');
      var b = document.createElement('b');
      b.textContent = c[2];
      fila.appendChild(b);
      fila.appendChild(document.createTextNode(valor));
      div.appendChild(fila);
    });
    if (!hayAlgo) div.appendChild(document.createTextNode('(el modelo no devolvió el formato esperado; vuelve a pulsar «resumen IA»)'));
    if (res.citaPropuesta) {
      var fc = document.createElement('div');
      fc.className = 'campo-ia cita-ia';
      var bc = document.createElement('b');
      bc.textContent = res.cita ? 'Cita verificada ✓' : 'Cita descartada';
      fc.appendChild(bc);
      fc.appendChild(document.createTextNode(res.cita ? '«' + res.cita + '»' : 'el modelo propuso una frase que no está literal en la respuesta.'));
      div.appendChild(fc);
    }
    return div;
  }

  function resumirIA(r, texto) {
    if (!texto) return;
    var pregunta = preguntaActiva;
    var clave = r.seudonimo + '|' + pregunta;
    cacheIA[clave] = { estado: 'cargando' };
    pintarRespuestas();
    fetch(OLLAMA + '/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODELO_IA, prompt: PROMPT(texto, (TITULOS[sesion] || {})[pregunta]), stream: false,
        options: { temperature: 0.2, num_predict: 900, num_ctx: 4096 }
      })
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error('estado ' + resp.status);
        return resp.json();
      })
      .then(function (j) {
        var res = parsearIA(j.response || '');
        res.estado = 'ok';
        res.citaPropuesta = res.cita || '';
        res.cita = res.citaPropuesta ? verificarCita(res.citaPropuesta, texto) : null;
        cacheIA[clave] = res;
        pintarRespuestas();
      })
      .catch(function () {
        cacheIA[clave] = { estado: 'error', msg:
          'No pude hablar con Ollama en ' + OLLAMA + '. Comprueba que corre («ollama serve») y que lo lanzaste con ' +
          'OLLAMA_ORIGINS=* para permitir la llamada desde el navegador. El resumen IA solo funciona con este ' +
          'tablero abierto como archivo local, no por HTTPS.' };
        pintarRespuestas();
      });
  }

  function resumirVisibles() {
    if (!datos) return;
    var hayFiltro = Object.keys(seleccion).length > 0;
    datos.respuestas.forEach(function (r) {
      if (hayFiltro && !seleccion[r.seudonimo]) return;
      var texto = String(r.respuestas[preguntaActiva] || '').trim();
      var clave = r.seudonimo + '|' + preguntaActiva;
      if (texto && !cacheIA[clave]) resumirIA(r, texto);
    });
  }

  /* ── Síntesis: generar, guardar y pintar ─────────────────────────── */
  function claveSintesis() { return 'INV_REHAB_tablero_sintesis_' + sesion; }
  function cargarSintesis() {
    try { cacheSint = JSON.parse(localStorage.getItem(claveSintesis()) || '{}'); }
    catch (err) { cacheSint = {}; }
  }
  function guardarSintesis() {
    var limpio = {};
    Object.keys(cacheSint).forEach(function (k) {
      if (cacheSint[k] && cacheSint[k].estado === 'ok') limpio[k] = cacheSint[k];
    });
    try { localStorage.setItem(claveSintesis(), JSON.stringify(limpio)); } catch (err) { /* sin espacio */ }
  }
  function textosDe(pregunta) {
    if (!datos || !datos.respuestas) return [];
    return datos.respuestas.map(function (r) { return String(r.respuestas[pregunta] || '').trim(); })
      .filter(function (t) { return t; });
  }

  function sintetizar(pregunta) {
    var textos = textosDe(pregunta);
    if (!textos.length) return Promise.resolve();
    cacheSint[pregunta] = { estado: 'cargando' };
    pintarSintesis();
    return fetch(OLLAMA + '/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODELO_IA, prompt: PROMPT_SINTESIS(textos, (TITULOS[sesion] || {})[pregunta]), stream: false,
        options: { temperature: 0.2, num_predict: 800, num_ctx: 8192 }
      })
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error('estado ' + resp.status);
        return resp.json();
      })
      .then(function (j) {
        var res = parsearSintesis(j.response || '', textos);
        res.estado = res.ideas.length ? 'ok' : 'error';
        res.cuando = new Date().toLocaleString('es-CO');
        res.n = textos.length;
        if (res.estado === 'error') res.msg = 'El modelo no devolvió el formato esperado. Vuelve a intentarlo.';
        cacheSint[pregunta] = res;
        guardarSintesis();
        pintarSintesis();
      })
      .catch(function () {
        cacheSint[pregunta] = { estado: 'error', msg:
          'No pude hablar con Ollama en ' + OLLAMA + '. Comprueba que corre («ollama serve») y que lo lanzaste con ' +
          'OLLAMA_ORIGINS=* . Las señales contadas de arriba siguen funcionando sin él.' };
        pintarSintesis();
      });
  }

  function sintetizarSesion() {
    if (!datos || !datos.preguntas) return;
    var cola = datos.preguntas.slice();
    (function siguiente() {
      if (!cola.length) return;
      var p = cola.shift();
      if (cacheSint[p] && cacheSint[p].estado === 'ok') return siguiente();
      sintetizar(p).then(siguiente);
    })();
  }

  function textoSintesis(pregunta) {
    var res = cacheSint[pregunta] || {}, titulos = TITULOS[sesion] || {};
    var L = [(titulos[pregunta] || pregunta.toUpperCase()), ''];
    (res.ideas || []).forEach(function (id) {
      L.push('- ' + id.texto + (id.apoyos ? ' (' + id.apoyos + ' de ' + (res.n || '?') + ')' : ''));
    });
    if (res.acuerdo) L.push('', 'Coinciden en: ' + res.acuerdo);
    if (res.tension) L.push('Tensión: ' + res.tension);
    if (res.instrumentos) L.push('Instrumentos nombrados: ' + res.instrumentos);
    if (res.vacio) L.push('Nadie menciona: ' + res.vacio);
    if (res.preguntas) L.push('Para devolver al grupo: ' + res.preguntas);
    var cc = (res.citas && res.citas.length) ? res.citas : citasDetectadas(textosDe(pregunta));
    cc.forEach(function (c) { L.push('«' + c + '»'); });
    return L.join('\n');
  }

  function bloque(titulo, texto, cont) {
    if (!texto) return;
    var d = document.createElement('div');
    d.className = 'bloque';
    var h = document.createElement('h3');
    h.textContent = titulo;
    d.appendChild(h);
    var p = document.createElement('p');
    p.textContent = texto;
    d.appendChild(p);
    cont.appendChild(d);
  }

  function pintarSintesis() {
    var cont = $('sintesis');
    cont.textContent = '';
    if (!datos || !datos.entregas || !preguntaActiva) return;
    var textos = textosDe(preguntaActiva);
    var sg = senales(textos);

    /* Mandos (no se proyectan) */
    var acc = document.createElement('div');
    acc.className = 'sintesis__acciones';
    var res = cacheSint[preguntaActiva];
    var b1 = document.createElement('button');
    b1.type = 'button';
    b1.textContent = (res && res.estado === 'ok') ? 'Rehacer esta pregunta' : 'Sintetizar esta pregunta';
    b1.onclick = function () { sintetizar(preguntaActiva); };
    acc.appendChild(b1);
    var b2 = document.createElement('button');
    b2.type = 'button';
    b2.className = 'otra';
    b2.textContent = 'Sintetizar toda la sesión';
    b2.onclick = sintetizarSesion;
    acc.appendChild(b2);
    if (res && res.estado === 'ok') {
      var b3 = document.createElement('button');
      b3.type = 'button';
      b3.className = 'otra';
      b3.textContent = 'Copiar';
      b3.onclick = function () {
        var t = textoSintesis(preguntaActiva);
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { b3.textContent = 'Copiada'; });
      };
      acc.appendChild(b3);
    }
    cont.appendChild(acc);

    /* Señales contadas: exactas, sin modelo */
    var chips = document.createElement('div');
    chips.className = 'senales';
    var c0 = document.createElement('span');
    c0.className = 'senal';
    c0.innerHTML = '<b>' + textos.length + ' de ' + datos.entregas + '</b> respondieron · ' + sg.palabras + ' palabras de media';
    chips.appendChild(c0);
    sg.ausencias.forEach(function (a) {
      var c = document.createElement('span');
      c.className = 'senal falta';
      c.innerHTML = '<b>' + a.n + ' de ' + textos.length + '</b> dicen que ' + a.etq;
      chips.appendChild(c);
    });
    sg.instrumentos.slice(0, 8).forEach(function (i) {
      var c = document.createElement('span');
      c.className = 'senal';
      c.innerHTML = i.etq + ' <b>' + i.n + '</b>';
      chips.appendChild(c);
    });
    if (!sg.instrumentos.length && textos.length) {
      var c = document.createElement('span');
      c.className = 'senal falta';
      c.textContent = 'Ninguna respuesta nombra un instrumento conocido';
      chips.appendChild(c);
    }
    cont.appendChild(chips);

    if (!textos.length) return;
    if (!res) {
      var vacio = document.createElement('p');
      vacio.className = 'sintesis__espera no-proyectar';
      vacio.textContent = 'Todavía no hay síntesis de esta pregunta. Pulsa «Sintetizar esta pregunta» (unos 20 a 40 segundos en este equipo) o prepara todas antes de clase.';
      cont.appendChild(vacio);
      return;
    }
    if (res.estado === 'cargando') {
      var esp = document.createElement('p');
      esp.className = 'sintesis__espera';
      esp.textContent = 'Agrupando las ' + textos.length + ' respuestas con ' + MODELO_IA + ', en este equipo…';
      cont.appendChild(esp);
      return;
    }
    if (res.estado === 'error') {
      var err = document.createElement('p');
      err.className = 'sintesis__espera no-proyectar';
      err.textContent = res.msg || 'No se pudo generar la síntesis.';
      cont.appendChild(err);
      return;
    }

    var ul = document.createElement('ul');
    ul.className = 'ideas';
    res.ideas.forEach(function (id) {
      var li = document.createElement('li');
      li.className = 'idea';
      li.appendChild(document.createTextNode(id.texto));
      if (id.apoyos) {
        var sp = document.createElement('span');
        sp.className = 'peso';
        sp.textContent = id.apoyos + ' de ' + (res.n || textos.length);
        li.appendChild(sp);
      }
      ul.appendChild(li);
    });
    cont.appendChild(ul);

    bloque('Coinciden en', res.acuerdo, cont);
    bloque('Tensión para discutir', res.tension, cont);
    bloque('Instrumentos que nombran', res.instrumentos, cont);
    bloque('Nadie menciona', res.vacio, cont);
    bloque('Para devolver al grupo', res.preguntas, cont);

    var citas = (res.citas && res.citas.length) ? res.citas : citasDetectadas(textos);
    var citasVerificadas = !!(res.citas && res.citas.length);
    if (citas.length) {
      var d = document.createElement('div');
      d.className = 'bloque';
      var h = document.createElement('h3');
      h.textContent = citasVerificadas
        ? 'En sus palabras (verificadas, sin autor)'
        : 'En sus palabras (frases encontradas en los textos, sin autor)';
      d.appendChild(h);
      var uc = document.createElement('ul');
      uc.className = 'citas';
      citas.forEach(function (c) {
        var li = document.createElement('li');
        li.textContent = '«' + c + '»';
        uc.appendChild(li);
      });
      d.appendChild(uc);
      cont.appendChild(d);
    }

    var meta = document.createElement('p');
    meta.className = 'sintesis__meta';
    meta.textContent = 'Borrador de máquina (' + MODELO_IA + ') sobre ' + (res.n || textos.length) +
      ' respuestas · ' + (res.cuando || '') + ' · revísalo antes de proyectarlo. Las citas se comprobaron contra el texto original.';
    cont.appendChild(meta);
  }

  function pintarRespuestas() {
    var cont = $('respuestas');
    cont.textContent = '';

    if (!datos) { $('titulo').textContent = '—'; $('subtitulo').textContent = ''; return; }
    if (!datos.entregas) {
      $('titulo').textContent = 'Todavía no hay entregas';
      $('subtitulo').textContent = datos.inscritos + ' estudiante(s) en el roster de ' + datos.sesion + '.';
      return;
    }

    var titulos = TITULOS[datos.sesion] || {};
    $('titulo').textContent = titulos[preguntaActiva] || preguntaActiva.toUpperCase();
    var marcadas = leidas();
    var conTexto = datos.respuestas.filter(function (r) { return String(r.respuestas[preguntaActiva] || '').trim(); });
    var elegidas = Object.keys(seleccion);
    $('subtitulo').textContent =
      conTexto.length + ' de ' + datos.entregas + ' respondieron esta pregunta · ' +
      datos.sesion + ' · ' + datos.titulo +
      (elegidas.length ? ' · confrontando ' + elegidas.sort().join(', ') : '');

    datos.respuestas.forEach(function (r) {
      if (elegidas.length && !seleccion[r.seudonimo]) return;
      var texto = String(r.respuestas[preguntaActiva] || '').trim();
      var idMarca = r.seudonimo + '|' + preguntaActiva;

      var t = document.createElement('article');
      t.className = 'tarjeta' + (marcadas[idMarca] ? ' leida' : '');

      var cab = document.createElement('div');
      cab.className = 'tarjeta__cab';
      var s = document.createElement('span');
      s.className = 'seudo';
      s.textContent = r.seudonimo;
      cab.appendChild(s);
      var q = document.createElement('span');
      q.className = 'quien';
      q.textContent = r.nombre + ' · ' + r.correo;
      cab.appendChild(q);
      var m = document.createElement('button');
      m.className = 'marca';
      m.textContent = marcadas[idMarca] ? 'discutida' : 'marcar';
      m.onclick = function () { alternarMarca(idMarca); };
      cab.appendChild(m);
      var bia = document.createElement('button');
      bia.className = 'tarjeta__ia';
      bia.type = 'button';
      bia.textContent = 'resumen IA';
      bia.onclick = function () { resumirIA(r, texto); };
      cab.appendChild(bia);
      t.appendChild(cab);

      var p = document.createElement('p');
      p.className = 'tarjeta__txt' + (texto ? '' : ' vacia');
      p.textContent = texto || 'Sin responder';
      t.appendChild(p);

      if (cacheIA[idMarca]) t.appendChild(nodoResumen(cacheIA[idMarca]));

      var pie = document.createElement('p');
      pie.className = 'tarjeta__pie';
      pie.textContent = 'v' + r.version + ' · ' + r.timestamp +
        (r.minutos ? ' · ' + r.minutos + ' min' : '') +
        (r.declaracionIA ? ' · declaró IA' : '');
      t.appendChild(pie);

      cont.appendChild(t);
    });
  }

  /* ── Controles ──────────────────────────────────────────────────── */
  var escala = 1;
  function aplicarEscala() { document.documentElement.style.setProperty('--escala', escala.toFixed(2)); }
  $('mas').onclick   = function () { escala = Math.min(2.4, escala + 0.12); aplicarEscala(); };
  $('menos').onclick = function () { escala = Math.max(0.8, escala - 0.12); aplicarEscala(); };
  $('recargar').onclick = cargar;
  $('vistaSintesis').onclick = function () { alternarSintesis(); };
  function alternarSintesis() {
    var on = document.body.classList.toggle('vista-sintesis');
    var b = $('vistaSintesis');
    b.classList.toggle('on', on);
    b.textContent = on ? 'Ver respuestas' : 'Síntesis';
    if (on) pintarSintesis();
  }
  $('proyeccion').onclick = function () {
    var on = document.body.classList.toggle('proyeccion');
    this.classList.toggle('on', on);
    this.textContent = on ? 'Proyección ACTIVA' : 'Modo proyección';
  };
  $('sesion').onchange = function () {
    sesion = this.value;
    preguntaActiva = null;
    seleccion = {};
    cargarSintesis();
    history.replaceState(null, '', '?sesion=' + sesion);
    cargar();
  };

  // Flechas para pasar de pregunta sin soltar el puntero del proyector.
  document.addEventListener('keydown', function (e) {
    if (!datos || !datos.preguntas.length) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var i = datos.preguntas.indexOf(preguntaActiva);
    if (e.key === 'ArrowRight' && i < datos.preguntas.length - 1) { preguntaActiva = datos.preguntas[i + 1]; pintarPreguntas(); pintarRespuestas(); pintarSintesis(); }
    if (e.key === 'ArrowLeft'  && i > 0)                          { preguntaActiva = datos.preguntas[i - 1]; pintarPreguntas(); pintarRespuestas(); pintarSintesis(); }
    if (e.key === 's' || e.key === 'S') alternarSintesis();
  });

  cargarSintesis();
  cargar();
})();
</script>
</html>
