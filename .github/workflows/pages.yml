####################################################################
# Despliegue de GitHub Pages desde Actions.
#
# Requiere: Settings → Pages → Source: GitHub Actions.
#
# .nojekyll es imprescindible: sin él, Jekyll descarta en silencio
# toda carpeta que empiece por guion bajo — y _shared/ desaparecería
# del sitio sin ningún error visible. El job de despliegue falla a
# propósito si el archivo no está.
####################################################################
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si dos empujes se solapan, el segundo espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobaciones previas (enlaces, portabilidad, datos, lenguaje, manifiesto)
        run: node scripts/verificar.js

  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que .nojekyll existe
        run: |
          if [ ! -f .nojekyll ]; then
            echo "::error::Falta .nojekyll — _shared/ desaparecería del sitio sin aviso."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
